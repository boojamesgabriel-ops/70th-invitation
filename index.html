<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <section class="envelope-screen">
        <p class="intro">A special invitation awaits</p>

        <button class="envelope" type="button" aria-label="Your birthday invitation is inside">

            <svg class="envelope__clip-defs" aria-hidden="true" focusable="false">
                <defs>
                    <clipPath id="envelope-bottom-clip" clipPathUnits="objectBoundingBox">
                    <path d="
                        M 0 1
                        C 0 0.92, 0.035 0.86, 0.12 0.80
                        L 0.5 0.36
                        L 0.88 0.80
                        C 0.965 0.86, 1 0.92, 1 1
                        Z
                    " />
                    </clipPath>
                </defs>
            </svg>

            <span class="envelope__paper" aria-hidden="true"></span>
            <span class="envelope__back" aria-hidden="true"></span>
            <span class="envelope__front-left" aria-hidden="true"></span>
            <span class="envelope__front-right" aria-hidden="true"></span>
            <span class="envelope__front-bottom" aria-hidden="true"></span>
            <span class="envelope__flap" aria-hidden="true"></span>

            <svg
                class="envelope__seams"
                viewBox="0 0 148 100"
                preserveAspectRatio="none"
                aria-hidden="true"
                >
                <path class="envelope__seam-top" d="M2 2 74 72 146 2" />
                <path
                    class="envelope__seam-bottom"
                    d="M 0 100 C 0 92, 5 86, 18 80 L 74 36 L 130 80 C 143 86, 148 92, 148 100"
                />
            </svg>

            <span class="envelope__seal" aria-hidden="true">
                <img src="assets/22.png" alt="" />
            </span>
        </button>

        <p class="tap-hint">Tap the envelope to open</p>
    </section>
</body>
</html>
